port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7893
mixed-port: 7894
allow-lan: true
bind-address: "*"
authentication:
  - mihomo:yanet
skip-auth-prefixes:
  - 127.0.0.1/8
  - ::1/128
mode: rule
log-level: warning
ipv6: false
keep-alive-idle: 15
keep-alive-interval: 15
disable-keep-alive: false
find-process-mode: strict
external-controller: 0.0.0.0:9090
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true
external-controller-routing-mark: 5566
secret: yanet
external-ui: ./external-ui
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
profile:
  store-fake-ip: true
  store-selected: true
unified-delay: true
tcp-concurrent: true
routing-mark: 6666
geodata-mode: false
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
  asn: https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb
global-ua: clash.meta
etag-support: true
ntp:
  enable: true
  write-to-system: false
  server: ntp.aliyun.com
dns:
  enable: true
  cache-algorithm: arc
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - geosite:gfw
    - geosite:jetbrains-ai
    - geosite:category-ai-!cn
    - geosite:category-ai-chat-!cn
    - geosite:telegram
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  proxy-server-nameserver:
    - 178.94.14.101
    - 14.137.229.81
  fallback:
    - https://dns.adguard-dns.com/dns-query
    - https://dns.cloudflare.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
  nameserver-policy:
    geosite:private: system
    geosite:tld-cn,cn,steam@cn,category-games@cn,microsoft@cn,apple@cn,category-game-platforms-download@cn,category-public-tracker:
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    geosite:jetbrains-ai,category-ai-!cn,category-ai-chat-!cn:
      - https://dns.adguard-dns.com/dns-query
      - https://dns.cloudflare.com/dns-query
  proxy-server-nameserver-policy: {}
tun:
  enable: true
  stack: mixed
  device: utun1999
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
  mtu: 1500
  gso: true
  gso-max-size: 65536
  exclude-interface:
    - NodeBabyLink
  route-exclude-address:
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.168.0.0/16
    - 224.0.0.0/4
    - 240.0.0.0/4
    - 255.255.255.255/32
    - ::/128
    - ::1/128
    - FC00::/7
    - FE80::/10
    - FF00::/8
  dns-hijack:
    - any:53
    - tcp://any:53
sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
    QUIC:
      ports:
        - 443
        - 8443
  skip-src-address:
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.168.0.0/16
    - 224.0.0.0/4
    - 240.0.0.0/4
    - 255.255.255.255/32
    - ::/128
    - ::1/128
    - FC00::/7
    - FE80::/10
    - FF00::/8
  skip-domain:
    - Mijia Cloud
